[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-viewer"
version = "0.1.0"
description = "Read-only Minecraft Java world archive viewer"
requires-python = ">=3.10"
dependencies = ["nbtlib>=2.0,<3", "Pillow>=10,<12"]

[project.gui-scripts]
minecraft-viewer = "minecraft_viewer.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
minecraft_viewer = ["schema.sql", "data/*.json"]
